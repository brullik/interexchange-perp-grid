name: release-image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to build and publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "release tag does not match the allowed RC format" >&2
            exit 2
          fi

      - name: Checkout exact annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Prove annotated tag and target SHA
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          target_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$target_sha" = "$(git rev-parse HEAD)"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish exact-tag image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$TARGET_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --tag "$image:$RELEASE_TAG" \
            --tag "$image:sha-$TARGET_SHA" \
            .
          docker push "$image:$RELEASE_TAG"
          docker push "$image:sha-$TARGET_SHA"
          registry_digest="$(docker buildx imagetools inspect "$image:$RELEASE_TAG" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$registry_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid immutable digest" >&2
            exit 3
          fi
          IMAGE="$image" REGISTRY_DIGEST="$registry_digest" \
            python -c 'import json,os,pathlib; pathlib.Path("release-image-manifest.json").write_text(json.dumps({"image":os.environ["IMAGE"],"release_tag":os.environ["RELEASE_TAG"],"target_sha":os.environ["TARGET_SHA"],"registry_digest":os.environ["REGISTRY_DIGEST"],"run_id":os.environ["GITHUB_RUN_ID"]},sort_keys=True)+"\n",encoding="utf-8")'

      - name: Upload immutable image manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ inputs.release_tag }}-${{ steps.release.outputs.target_sha }}
          path: release-image-manifest.json
          if-no-files-found: error
          retention-days: 90
