name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify
        run: make verify

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure safe defaults
        run: cp .env.example .env
      - name: Build and wait for health
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify live service health
        run: docker compose exec -T app interexchange-grid health --config /app/config/defaults.yaml
      - name: Restart and verify persisted runtime state
        run: |
          docker compose restart app
          docker compose up --detach --wait --wait-timeout 120
          docker compose exec -T app interexchange-grid health --config /app/config/defaults.yaml \
            | python -c 'import json, sys; payload = json.load(sys.stdin); assert payload["starts"] >= 2, payload'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
