name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
          python scripts/check_lock.py --lock requirements.lock --pyproject pyproject.toml --verify-installed
      - name: Verify
        run: make verify
      - name: Build exact replay/fault/restart evidence
        run: >-
          interexchange-grid replay-proof
          --repo-root .
          --config config/defaults.yaml
          --output state/replay-proof.json
      - name: Upload replay evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            state/replay-proof.json
            state/replay-proof.junit.xml
          if-no-files-found: error
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact application lock
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
          python scripts/check_lock.py --lock requirements.lock --pyproject pyproject.toml --verify-installed
      - name: Install exact security tooling lock
        run: |
          python -m pip install -r requirements-security.lock
          python scripts/check_lock.py --lock requirements-security.lock --verify-installed \
            --required pip-audit bandit detect-secrets cyclonedx-bom
      - name: Dependency audit
        run: |
          mkdir -p state/pip-audit-cache
          pip-audit --cache-dir state/pip-audit-cache --disable-pip --no-deps --progress-spinner off \
            --requirement requirements.lock --format json --output state/dependency-audit.json
      - name: Secret scan
        run: |
          detect-secrets scan --no-verify \
            --disable-plugin Base64HighEntropyString \
            --disable-plugin HexHighEntropyString \
            --disable-plugin KeywordDetector . > state/secret-scan.json
          python scripts/check_secret_scan.py state/secret-scan.json
      - name: Lightweight static security scan
        run: bandit -q -r src -ll
      - name: Reproducible dependency SBOM
        run: >-
          cyclonedx-py requirements requirements.lock
          --pyproject pyproject.toml
          --output-reproducible
          --output-format JSON
          --output-file state/release-sbom.json
      - name: Upload security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            state/dependency-audit.json
            state/secret-scan.json
            state/release-sbom.json
          if-no-files-found: error
          retention-days: 30

  c4-critical-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact lock
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
          python scripts/check_lock.py --lock requirements.lock --pyproject pyproject.toml --verify-installed
      - name: Build exact release image
        run: docker build --tag interexchange-perp-grid:c4-proof .
      - name: Build exact C4 critical proof
        run: |
          IMAGE_DIGEST="$(docker image inspect interexchange-perp-grid:c4-proof --format '{{.Id}}')"
          interexchange-grid c4-proof \
            --repo-root . \
            --config config/defaults.yaml \
            --baseline config/c4-critical-test-manifest.json \
            --nodeids config/c4-scenario-nodeids.json \
            --output-root artifacts \
            --image-digest "$IMAGE_DIGEST"
      - name: Upload exact C4 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c4-critical-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/c4-critical-proof-${{ github.event.pull_request.head.sha || github.sha }}/
          if-no-files-found: error
          retention-days: 30

  c4-3-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact lock
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
          python scripts/check_lock.py --lock requirements.lock --pyproject pyproject.toml --verify-installed
      - name: Build exact release image
        run: docker build --tag interexchange-perp-grid:c4-3-proof .
      - name: Build exact C4.3 stable-FLAT proof
        run: |
          IMAGE_DIGEST="$(docker image inspect interexchange-perp-grid:c4-3-proof --format '{{.Id}}')"
          interexchange-grid c4-3-proof \
            --repo-root . \
            --config config/defaults.yaml \
            --runtime-policy config/RUNTIME_POLICY.yaml \
            --scenarios config/c4-3-required-scenarios.json \
            --output-root artifacts \
            --image-digest "$IMAGE_DIGEST"
      - name: Upload exact C4.3 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c4-3-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/c4-3-proof-${{ github.event.pull_request.head.sha || github.sha }}/
          if-no-files-found: error
          retention-days: 30

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact application lock
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
          python scripts/check_lock.py --lock requirements.lock --pyproject pyproject.toml --verify-installed
      - name: Configure safe defaults
        run: |
          cp .env.example .env
          chmod 0600 .env
          mkdir -p state/ops-evidence
          printf '{"runner_image":"ubuntu-24.04"}\n' > state/ops-evidence/platform.json
      - name: Build and wait for health
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify live service health
        run: |
          docker compose exec -T app interexchange-grid health --config /app/config/defaults.yaml \
            | tee state/ops-evidence/clean-health.json
      - name: Restart and verify persisted runtime state
        run: |
          docker compose restart app
          docker compose up --detach --wait --wait-timeout 120
          docker compose exec -T app interexchange-grid health --config /app/config/defaults.yaml \
            | python -c 'import json, sys; payload = json.load(sys.stdin); assert payload["starts"] >= 2, payload'
      - name: Prove host restart recovery
        run: |
          docker compose down
          docker compose up --detach --no-build --wait --wait-timeout 120
          docker compose exec -T app interexchange-grid health --config /app/config/defaults.yaml \
            | tee state/ops-evidence/restart-health.json \
            | python -c 'import json, sys; payload = json.load(sys.stdin); assert payload["starts"] >= 3, payload'
      - name: Prove idempotent immutable-digest deployment
        run: |
          docker compose down
          docker run --detach --name "ipeg-registry-${GITHUB_RUN_ID}" --publish 5000:5000 \
            registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null
          release_sha="$(git rev-parse HEAD)"
          local_tag="localhost:5000/interexchange-perp-grid:$release_sha"
          docker build --tag "$local_tag" .
          docker push "$local_tag"
          image_ref="$(docker image inspect "$local_tag" --format '{{index .RepoDigests 0}}')"
          [[ "$image_ref" =~ @sha256:[0-9a-f]{64}$ ]]
          bash scripts/shadow-deploy.sh "$image_ref" "$release_sha"
          bash scripts/shadow-deploy.sh "$image_ref" "$release_sha"
          docker compose exec -T app interexchange-grid health --config /app/config/defaults.yaml
          docker compose exec -T app interexchange-grid deployment-identity \
            --config /app/config/defaults.yaml --expected-release-sha "$release_sha" \
            --expected-image-digest "${image_ref##*@}" \
            > state/ops-evidence/deployment-identity.json
      - name: Prove real unhealthy upgrade restores image and SQLite state
        run: |
          release_sha="$(git rev-parse HEAD)"
          image_ref="$(sed -n 's/^image_ref=//p' .ipeg-deployment-state)"
          docker compose exec -T app python -c \
            "import sqlite3; p='/app/state/ipeg.sqlite3'; d=sqlite3.connect(p); d.execute(\"INSERT INTO metadata(key,value) VALUES ('ops_rollback_sentinel','good') ON CONFLICT(key) DO UPDATE SET value='good'\"); d.commit()"
          bad_tag="localhost:5000/interexchange-perp-grid:unhealthy-${release_sha}"
          docker build --file Dockerfile.unhealthy-test --build-arg "BASE_IMAGE=${image_ref}" \
            --tag "$bad_tag" .
          docker push "$bad_tag"
          bad_ref="$(docker image inspect "$bad_tag" --format '{{index .RepoDigests 0}}')"
          set +e
          bash scripts/shadow-upgrade.sh "$bad_ref" "$release_sha"
          upgrade_status=$?
          set -e
          test "$upgrade_status" -ne 0
          test "$(sed -n 's/^image_ref=//p' .ipeg-deployment-state)" = "$image_ref"
          test "$(sed -n 's/^release_sha=//p' .ipeg-deployment-state)" = "$release_sha"
          docker compose exec -T app interexchange-grid health --config /app/config/defaults.yaml
          sentinel="$(docker compose exec -T app python -c \
            "import sqlite3; d=sqlite3.connect('/app/state/ipeg.sqlite3'); print(d.execute(\"SELECT value FROM metadata WHERE key='ops_rollback_sentinel'\").fetchone()[0])")"
          test "$sentinel" = good
          python - "$upgrade_status" "$release_sha" "$image_ref" <<'PY'
          import json, pathlib, sys
          status, release, image = sys.argv[1:]
          pathlib.Path('state/ops-evidence/rollback.json').write_text(json.dumps({
              'status': 'PASS',
              'failed_upgrade_exit_nonzero': int(status) != 0,
              'state_restored': True,
              'release_sha': release,
              'image_ref': image,
          }), encoding='utf-8')
          PY
      - name: Kill process and prove automatic supervisor recovery in simulator
        run: |
          IMAGE_ID="$(docker compose images -q app)"
          SMOKE_VOLUME="ipeg-c4-recovery-${GITHUB_RUN_ID}"
          docker volume create "$SMOKE_VOLUME"
          docker run --rm --user 0:0 --volume "$SMOKE_VOLUME:/smoke" "$IMAGE_ID" \
            chown ipeg:ipeg /smoke
          for state in PREPARED SUBMITTING ACKNOWLEDGED PARTIAL FILLED REJECTED UNKNOWN RECOVERING HEDGED CLOSING QUARANTINED; do
            state_slug="$(printf '%s' "$state" | tr '[:upper:]' '[:lower:]')"
            SMOKE_NAME="ipeg-c4-recovery-${GITHUB_RUN_ID}-${state_slug}"
            state_path="/smoke/${state_slug}.sqlite3"
            private_state_dir="/smoke/${state_slug}-private"
            ready_path="/smoke/${state_slug}.ready"
            docker run --detach --name "$SMOKE_NAME" --volume "$SMOKE_VOLUME:/smoke" "$IMAGE_ID" \
              interexchange-grid private-transition-recovery-smoke \
              --state "$state_path" --ready "$ready_path" --hold-after-active \
              --transition-state "$state" --private-state-dir "$private_state_dir"
            for attempt in $(seq 1 60); do
              docker exec "$SMOKE_NAME" test -f "$ready_path" && break
              sleep 1
            done
            docker exec "$SMOKE_NAME" test -f "$ready_path"
            docker kill "$SMOKE_NAME"
            docker rm "$SMOKE_NAME"
            docker run --rm --volume "$SMOKE_VOLUME:/smoke" "$IMAGE_ID" \
              interexchange-grid private-transition-recovery-smoke --state "$state_path" \
              --transition-state "$state" --private-state-dir "$private_state_dir" \
              | tee "state/ops-evidence/private-recovery-${state_slug}.json" \
              | python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"] == "PASS"; assert p["restarted_transition_state"] == sys.argv[1]; assert p["expected_action_count"] == 10; assert p["recovered_action_count"] == 10; assert p["flat_barrier_verified"] is True; assert p["priority_scheduler_restart_proof"] is True; assert p["new_entry_shed_while_p0_active"] is True; assert p["production_exchange_transports_opened"] == 0' "$state"
          done
          docker volume rm "$SMOKE_VOLUME"
      - name: Validate deployment scripts
        run: |
          bash -n scripts/release-build.sh scripts/shadow-deploy.sh scripts/shadow-upgrade.sh scripts/shadow-rollback.sh
          mapfile -t nodeids < <(python -c 'import json; p=json.load(open("config/ops-scenario-nodeids.json")); print("\n".join(sorted({v for xs in p.values() for v in xs if v.startswith("tests/")})))')
          pytest -q "${nodeids[@]}" --junitxml=state/ops-proof.junit.xml
          interexchange-grid ops-proof \
            --repo-root . \
            --config config/defaults.yaml \
            --junit state/ops-proof.junit.xml \
            --evidence-dir state/ops-evidence \
            --output state/ops-proof.json
      - name: Upload operations evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            state/ops-proof.json
            state/ops-proof.junit.xml
            state/ops-evidence/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: |
          docker compose down --volumes
          docker rm --force "ipeg-registry-${GITHUB_RUN_ID}" || true
