app:
  name: interexchange-perp-grid
  mode: shadow
  log_level: INFO
  heartbeat_interval_seconds: 5
  health_max_age_seconds: 20

venues:
  wave1_public:
    - binanceusdm
    - bybit
    - okx
  canary_primary:
    - bybit
    - okx
  canary_alternate:
    - binanceusdm
  wave2:
    - bitget
    - kucoinfutures
  wave3:
    - mexc
    - bingx
  quarantine_on_unknown_capability: true

products:
  settlement: USDT
  linear_only: true
  perpetual_only: true

risk:
  reference_capital_usdt: "500"
  pair_stressed_loss_limit_usdt: "5"
  portfolio_stressed_loss_limit_usdt: "50"
  max_active_routes: 10
  max_routes_per_base: 1
  max_tranches_per_route: 5
  local_free_margin_floor_ratio: "0.20"
  initial_effective_leverage_cap: "3"
  max_hold_seconds: 86400

strategy:
  adaptive_grid: true
  stressed_cost_multiplier: "2.0"
  minimum_profit_usdt: null
  grid_parameter_change_limit_ratio: "0.20"

execution:
  normal_intent: PROTECTED_AGGRESSIVE_TAKER
  normal_unbounded_market_allowed: false
  emergency_unbounded_market_allowed: true
  idempotent_client_order_ids: true
  third_venue_emergency_hedge: true

market_data:
  broad_feed: bbo
  candidate_feed: l2
  max_bbo_age_ms: 1500
  max_l2_age_ms: 1000
  max_clock_skew_ms: 1000

storage:
  sqlite_path: state/ipeg.sqlite3
  parquet_dir: data/market
  sqlite_wal: true

live:
  enabled: false
  require_local_unlock_secret: true
  require_telegram_challenge: true
  require_current_hash_qualification: true
  canary_max_routes: 1
  canary_max_tranches: 1

telegram:
  enabled: false
